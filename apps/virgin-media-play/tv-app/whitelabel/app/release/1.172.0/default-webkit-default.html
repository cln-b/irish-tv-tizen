  <script type='text/javascript'>
    // Create live region for screenreaders
    function createAriaLiveRegion() {
      if (document.getElementById('sr-live-region')) return;

      var region = document.createElement('div');
      region.id = 'sr-live-region';
      region.setAttribute('role', 'status');
      region.setAttribute('aria-live', 'polite');
      region.setAttribute('aria-atomic', 'true');

      // Completely outside layout / measurements
      region.style.position = 'fixed';
      region.style.top = '-99px';
      region.style.left = '-99px';
      region.style.width = '1px';
      region.style.height = '1px';
      region.style.overflow = 'hidden';
      region.style.pointerEvents = 'none';

      document.body.appendChild(region);
    }

    // Prompt screenreaders to read aloud a message
    function announce (message) {
      var region = document.getElementById('sr-live-region');
      if (!region) return;

      // Clear first so identical messages still fire
      region.textContent = '';
      setTimeout(function () {
        region.textContent = message;
      }, 50);
    }

    function waitForConfig() {
      if(configObj.apiSettings){
        loadApp()
      }else{
        setTimeout(function(){
          waitForConfig()
        }, 250);
      }
    }

    function forceHttps () {
      var HTTPS = "https:";
      var isSecure = getProtocol() === HTTPS;
      if (isSecure) return;

      var root = window.location.href.split("?")[0].replace("http://", "https://");
      var search = window.location.search;
      var hash = window.location.hash;
      search += "&httpforced=1";
      var url = root + search + hash;
      console.log("Forcing HTTPS: " + url);
      window.location.href = url;
    }

    function overridePlayer () {
      var platform = getQueryParameterValue('platform');
      var playerOverride = configObj.playerModule && (configObj.playerModule[platform] || configObj.playerModule.base);
      if (!playerOverride) return;

      // Shaka Player requires https (because http breaks Shaka DRM)
      var usesShaka = playerOverride.indexOf("shaka") > -1;
      if (usesShaka) forceHttps();

      console.log("Overriding player strategy: " + playerOverride);
      var modifiers = antie.framework.deviceConfiguration.modules.modifiers.map(function(item) {
        if (/antie\/devices\/mediaplayer\/(?!live\/)/.test(item))
          return playerOverride;
        return item;
      });
      antie.framework.deviceConfiguration.modules.modifiers = modifiers;
    }

    function pickPlayerVersion () {
      var platform = getQueryParameterValue('platform');
      if (configObj.playerVersion)
        window.playerVersion = configObj.playerVersion[platform] || configObj.playerVersion.base;
    }

    function getPlayerConfig () {
      var platform = getQueryParameterValue('platform');
      if (configObj.playerConfig)
        window.playerConfig = configObj.playerConfig[platform] || configObj.playerConfig.base;
    }

    function loadApp() {
      overridePlayer();
      pickPlayerVersion();
      getPlayerConfig();
      
      require(['whitelabelapp/appui/whitelabelapp'],
      function(WhiteLabelApp) {
        var onReady = function() {
          var staticLoadingScreen = document.getElementById('static-loading-screen');
          staticLoadingScreen.parentNode.removeChild(staticLoadingScreen);
          createAriaLiveRegion();
        };

        new WhiteLabelApp(
          document.getElementById('app'),
          'static/style/',
          'static/img/',
          onReady,
          queryString,
          configObj
        );
      });
    }

    if (requiresOfcomWarning()) {
      console.log('🔗 Requires Ofcom warning but has deeplink. ⏳ Must wait 5 seconds before starting app...');
      setTimeout(waitForConfig, 5000);
    } else {
      waitForConfig();
    }
  </script>
